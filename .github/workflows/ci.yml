name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose files
        run: |
          set -euo pipefail
          docker compose -f detection/compose.yaml config >/dev/null
          docker compose -f alerting/compose.yaml config >/dev/null
          # VM stack (default)
          docker compose -f storage/compose-vm.yaml config >/dev/null
          docker compose -f collectors/compose-vm.yaml config >/dev/null
          # Grafana stack (alternative)
          docker compose -f storage/compose-grafana.yaml config >/dev/null
          docker compose -f collectors/compose-grafana.yaml config >/dev/null
          # Common
          docker compose -f grafana/compose.yaml config >/dev/null
          docker compose -f ansible/compose.yaml config >/dev/null
          docker compose -f analysis/compose.yaml config >/dev/null

      - name: Check docs links (basic)
        run: |
          set -euo pipefail
          grep -R "(docs/" -n README.md >/dev/null || true
          test -f docs/index.md
          test -f docs/installation.md
          test -f docs/quickstart.md
          test -f docs/troubleshooting.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Shell script lint (shellcheck)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning scripts/*.sh

      - name: Test Falcosidekick config generation
        run: scripts/test-sidekick-config.sh

      - name: Test Falco config generation
        run: scripts/test-falco-config.sh

      - name: Python lint (ruff)
        run: |
          # Pinned: an unpinned ruff means any upstream release can turn CI red
          # without a code change. Bump deliberately, alongside ruff.toml.
          pip install ruff==0.16.0
          ruff check analysis/

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r analysis/requirements.txt
          pip install pytest

      - name: Run analysis tests
        working-directory: analysis
        run: pytest tests/ -q
