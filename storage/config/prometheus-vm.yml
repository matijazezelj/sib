# Source for storage/config/generated/prometheus-vm.yml, which the storage
# containers mount. Edit this file, then run make install-storage-*.
# ==============================================
# Prometheus-compatible Configuration for VictoriaMetrics
# ==============================================
# VictoriaMetrics uses the same scrape config format as Prometheus

global:
  scrape_interval: 15s
  scrape_timeout: 10s

# Scrape configurations
scrape_configs:
  # VictoriaMetrics self-monitoring
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['localhost:8428']
        labels:
          instance: 'sib-victoriametrics'

  # Host metrics via node_exporter
  - job_name: 'node'
    static_configs:
      - targets: ['sib-node-exporter:9100']
        labels:
          instance: 'sib-host'
          host: 'sib-host'

  # Falco liveness: up{job="falco"} feeds the "Falco not reporting" alert
  - job_name: 'falco'
    static_configs:
      - targets: ['sib-falco:8765']
        labels:
          instance: 'sib-falco'
          host: 'sib-host'
    metrics_path: '/metrics'

  # Falcosidekick metrics
  - job_name: 'falcosidekick'
    # SIB_SIDEKICK_TLS - becomes an https + client-certificate scrape when MTLS_ENABLED=true
    static_configs:
      - targets: ['sib-sidekick:2801']
        labels:
          instance: 'sib-sidekick'
    metrics_path: '/metrics'

  # VictoriaLogs metrics
  - job_name: 'victorialogs'
    static_configs:
      - targets: ['sib-victorialogs:9428']
        labels:
          instance: 'sib-victorialogs'
    metrics_path: '/metrics'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['sib-grafana:3000']
        labels:
          instance: 'sib-grafana'
    metrics_path: '/metrics'
