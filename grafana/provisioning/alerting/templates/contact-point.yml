# SIB alert contact point and notification policy.
# Copied to grafana/provisioning/alerting/contact-point.yml by `make install-grafana`
# only when GRAFANA_ALERT_WEBHOOK_URL is set in .env. Grafana fills in the
# $GRAFANA_ALERT_* variables from the container environment.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: sib-alerts
    receivers:
      - uid: sib-alerts
        type: $GRAFANA_ALERT_WEBHOOK_TYPE
        settings:
          url: $GRAFANA_ALERT_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: sib-alerts
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
