# SIB Grafana alert rules (VictoriaLogs + VictoriaMetrics stack)
# Copied to grafana/provisioning/alerting/alert-rules.yml by `make install-grafana`.
# Provisioned rules are read-only in the UI: edit thresholds here and re-run
# `make install-grafana`.
apiVersion: 1
groups:
- orgId: 1
  folder: SIB
  name: Pipeline health
  interval: 1m
  rules:
  - uid: sib-falco-drops
    title: Falco dropping syscall events
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victorialogs
      model:
        expr: 'rule:"Falco internal: syscall event drop" | stats by (hostname) count()'
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: Falco on {{ $labels.hostname }} is dropping syscall events
      description: '{{ $values.A }} drop alerts in 15 minutes. Detections may be missed; the host may need a bigger
        buffer (buf_size_preset) or fewer noisy rules.'
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-sidekick-output-errors
    title: Falcosidekick output errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        # Falcosidekick 2.29 exports falcosidekick_outputs; newer releases (2.35 checked) falcosecurity_falcosidekick_outputs_total.
        expr: sum by (destination) (increase(falcosidekick_outputs{status="error"}[15m])) or sum by (destination)
          (increase(falcosecurity_falcosidekick_outputs_total{status="error"}[15m]))
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: prometheus
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: Falcosidekick failed to deliver to {{ $labels.destination }}
      description: '{{ $values.A }} failed deliveries in 15 minutes. Check the output settings in .env and docker
        logs sib-sidekick.'
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-sidekick-down
    title: Falcosidekick down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up{job="falcosidekick"}
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: prometheus
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: Alerting
    execErrState: Error
    for: 5m
    annotations:
      summary: Falcosidekick is not responding
      description: Prometheus can't scrape sib-sidekick, so Falco events are not being stored or forwarded.
    labels:
      severity: critical
      source: sib
    isPaused: false
- orgId: 1
  folder: SIB
  name: Detection
  interval: 1m
  rules:
  - uid: sib-critical-burst
    title: Burst of Critical/Error events
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:syscall (priority:Critical or priority:Error) | stats by (hostname) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $values.A }} Critical/Error events on {{ $labels.hostname }} in 10 minutes'
      description: A burst of high-priority detections on one host often means an active intrusion or a broken workload.
        Review it in the Events Explorer.
    labels:
      severity: critical
      source: sib
    isPaused: false
  - uid: sib-critical-event
    title: Critical Falco event
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:syscall priority:Critical | stats by (hostname, rule) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: 'Critical: {{ $labels.rule }} on {{ $labels.hostname }}'
      description: 'Paused by default: Falcosidekick already forwards every event to its outputs. Resume this rule
        if Grafana is your only notification channel.'
    labels:
      severity: critical
      source: sib
    isPaused: true
- orgId: 1
  folder: SIB
  name: Detection baselines
  interval: 5m
  rules:
  - uid: sib-host-spike
    title: Event spike on a host
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:syscall | stats by (hostname) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:syscall | stats by (hostname) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: B
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: math
        expression: $A > 50 && $A > 5 * $B / 144
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: Event volume on {{ $labels.hostname }} is 5x its daily average
      description: '{{ $values.A }} events in the last 10 minutes, against a 24-hour average of {{ $values.B }}
        per day.'
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-rule-spike
    title: Rule firing far above normal
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:syscall | stats by (rule) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:syscall | stats by (rule) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: B
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: math
        expression: $A > 50 && $A > 5 * $B / 144
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $labels.rule }} is firing 5x above its daily average'
      description: '{{ $values.A }} events in the last 10 minutes. A new rule hit across the fleet, or a noisy rule
        that needs tuning.'
    labels:
      severity: warning
      source: sib
    isPaused: false
- orgId: 1
  folder: SIB
  name: Resources
  interval: 1m
  rules:
  - uid: sib-disk-full
    title: Disk almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, mountpoint) (100 - node_filesystem_avail_bytes{job=~"node|integrations/unix",fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{job=~"node|integrations/unix",fstype!~"tmpfs|overlay|squashfs"} * 100)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: prometheus
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: '{{ $labels.mountpoint }} on {{ $labels.host }} is {{ humanize $values.A.Value }}% full'
      description: 'On the SIB server this is usually log storage: lower the retention in .env.'
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-memory-high
    title: Memory usage high
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host) ((1 - node_memory_MemAvailable_bytes{job=~"node|integrations/unix"} / node_memory_MemTotal_bytes{job=~"node|integrations/unix"})
          * 100)
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: prometheus
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: Memory on {{ $labels.host }} is {{ humanize $values.A.Value }}% used
      description: Sustained for 15 minutes.
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-storage-down
    title: Storage backend down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up{job=~"victorialogs|victoriametrics"}
        instant: true
        range: false
        datasource:
          type: prometheus
          uid: prometheus
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: '{{ $labels.job }} is not responding'
      description: Events or metrics are not being stored. No data at all also fires this alert, since it usually
        means the metrics store itself is down.
    labels:
      severity: critical
      source: sib
    isPaused: false
- orgId: 1
  folder: SIB
  name: HIB
  interval: 1m
  rules:
  - uid: sib-hib-critical
    title: HIB critical security event
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:hib severity:critical | stats by (hostname, event) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: 'HIB on {{ $labels.hostname }}: {{ $labels.event }}'
      description: 'A critical HIB event, e.g. protected.reverted: an agent changed git hooks, git config or agent
        config without approval and HIB put it back. Look for persistence attempts in that workspace (docs/hib-integration.md).'
    labels:
      severity: critical
      source: sib
    isPaused: false
  - uid: sib-hib-auth-failures
    title: HIB authentication failures
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:hib event:auth.failure | stats by (hostname) sum(count) as failures
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: Repeated authentication failures against HIB on {{ $labels.hostname }}
      description: '{{ $values.A }} failed requests in 15 minutes (bad token, Host or Origin). Something local is
        trying to use HIB''s API without its token.'
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-hib-denials
    title: HIB agent denials burst
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:hib event:in(tool.permission, data.block) -decision:allow -decision:always | stats by (hostname)
          count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: Coding agent on {{ $labels.hostname }} keeps hitting HIB denials
      description: '{{ $values.A }} denied tool calls (network requests included) or blocked data reads in 15 minutes.
        An agent repeatedly trying what it may not do is worth a look.'
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-hib-sandbox-unavailable
    title: HIB sandbox unavailable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:hib event:sandbox.unavailable | stats by (hostname) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: HIB on {{ $labels.hostname }} is running without its sandbox
      description: HIB's sandbox probe failed, so agents run without the filesystem and network sandbox and auto
        mode is off.
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-hib-events-key-refused
    title: HIB event hash key refused
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:hib event:events.key_refused | stats by (hostname) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: HIB on {{ $labels.hostname }} refuses its event hash key
      description: HIB's events.key (~/.hib/events.key) is unusable (wrong owner, permissions, a symlink or bad
        content), so HIB drops every session, tool, guard and data.block event until the key is fixed and the
        daemon restarted. Heartbeats still arrive. The event's reason field says what is wrong. HIB reports it once
        per daemon run, so the alert stays up for 24 hours.
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-hib-scope-unavailable
    title: HIB session scope unavailable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: victorialogs
      model:
        expr: source:hib event:scope.unavailable | stats by (hostname) count()
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: HIB on {{ $labels.hostname }} can't put agent sessions in scopes
      description: HIB has [events] session_scope = true but couldn't start a systemd user scope (no systemd-run,
        no XDG_RUNTIME_DIR, or no user systemd), so agent CLIs run unscoped and Falco can tie their processes to
        a session only by ancestry and the HIB_SESSION variable. The event's reason field says why. HIB checks once
        per daemon start, so the alert stays up for 24 hours.
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-hib-test-mode
    title: HIB running in test mode
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: victorialogs
      model:
        expr: 'source:hib event:daemon.start script_driver:true | stats by (hostname) count()'
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: HIB on {{ $labels.hostname }} runs its scripted test agent
      description: HIB started with [testing] script_dir set (daemon.start with script_driver true), so a message
        naming hib-script:<name> replays scripted tool calls instead of running an agent. That belongs on test
        machines only. Remove [testing] from ~/.hib/config.toml and restart HIB, or silence this alert for hosts
        that run SIB's or HIB's acceptance tests. The alert stays up for 24 hours after the start.
    labels:
      severity: warning
      source: sib
    isPaused: false
  - uid: sib-hib-not-running
    title: HIB daemon not running
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: victorialogs
      model:
        expr: 'source:hib event:in(daemon.alive, daemon.start, daemon.stop) | math _time as t | stats by (hostname)
          max(t) if (event:in(daemon.alive, daemon.start)) as last_seen, max(t) if (event:daemon.stop) as last_stop,
          count() if (event:in(daemon.alive, daemon.start) _time:15m) as recent | filter last_seen:>0 recent:=0 | math
          last_seen - (last_stop default 0) as gap | filter gap:>0 | stats by (hostname) count() as down'
        queryType: stats
        datasource:
          type: victoriametrics-logs-datasource
          uid: victorialogs
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: HIB on {{ $labels.hostname }} stopped sending heartbeats
      description: 'HIB''s last heartbeat or start in the last 24 hours is more than 15 minutes old, and no clean
        daemon.stop came after it: it crashed, was killed, or its events stopped reaching SIB. Agents may now run
        without HIB''s guard.'
    labels:
      severity: warning
      source: sib
    isPaused: false
