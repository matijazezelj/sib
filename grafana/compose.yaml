# Grafana - Unified Security Dashboard

services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: sib-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      # Anonymous access (for demo purposes, disable in production)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Logging
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      # Alert notifications (contact point provisioned only when the URL is set)
      - GRAFANA_ALERT_WEBHOOK_URL=${GRAFANA_ALERT_WEBHOOK_URL:-}
      - GRAFANA_ALERT_WEBHOOK_TYPE=${GRAFANA_ALERT_WEBHOOK_TYPE:-slack}
      - GRAFANA_ALERT_TELEGRAM_BOT_TOKEN=${GRAFANA_ALERT_TELEGRAM_BOT_TOKEN:-}
      # External heartbeat (heartbeat rule installed only when set)
      - GRAFANA_HEARTBEAT_URL=${GRAFANA_HEARTBEAT_URL:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    networks:
      - sib-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sib-network:
    external: true

volumes:
  grafana-data:
