# =============================================================================
# SIB rule pack: coding agents (Claude Code, Codex, and HIB which runs them)
# =============================================================================
# Opt-in, like cloud_rules.yaml / webserver_rules.yaml. Enable it on hosts where
# coding agents run unattended or through HIB (https://github.com/matijazezelj/hib):
#   - SIB server: add /etc/falco/rules/coding_agent_rules.yaml to rules_files in
#     detection/config/falco.yaml.template, then make install-detection
#   - fleet hosts: add coding_agent_rules.yaml to falco_custom_rules for the host
#     (inventory host_vars or group_vars), then make deploy-fleet / make update-rules
#
# The agents' own CLIs legitimately read their config and credentials; what these
# rules flag is a *child* of an agent (a shell, a script it ran) touching
# credentials, a credential store read by something other than its own tool, or
# an agent (the CLI itself included) writing persistence or git hooks, directly
# or by renaming or linking a file into place. HIB's sandbox denies most of this,
# so a hit usually means a sandbox bypass or an unsandboxed agent.
#
# Agents are recognised by process name and executable path (claude, codex) and
# up to 8 levels of ancestry, so on their own these miss an npm install running
# under `node`, a process that detaches (setsid, nohup, reparented to init) and
# a deeper tree. Under HIB two more signals cover those:
#   - session scopes (HIB 0.4.0+, Linux, [events] session_scope = true): each
#     agent CLI runs in the systemd user scope hib-<session_id>-<8 hex>.scope,
#     and everything it starts stays in that cgroup, through env -i, setsid
#     and any shell. Only leaving the scope (systemd-run --user, unsandboxed)
#     escapes it. The alert's cgroups= field names the scope.
#   - the HIB_SESSION variable (HIB 0.2.0+), best effort: Falco only sees the
#     first 4096 bytes of a process's environment and shells reorder it; HIB's
#     minimal CLI environment keeps it in range (measured at 374-1553 bytes),
#     but a shell rc exporting a lot can push it out, and `env -i` clears it.
#     The alert's session= field names the session.
# Claude Code's own Write/Edit tool writes through /proc/self/fd/<dirfd>/name
# and renames into place there, a path Falco doesn't resolve, so where the CLI
# itself writes is invisible to these rules (what its children write is not);
# under HIB, its protected.reverted (workspace hooks and agent config) and
# home.changed (shell startup files, user agent config) events cover the CLI.
# The own-tool exemptions match on process name, so a binary renamed to e.g.
# "gh" is exempt too.
# See docs/hib-integration.md.
# =============================================================================

- required_engine_version: 0.31.0

- list: coding_agent_binaries
  items: [claude, codex]

# Each credential store and the tools that legitimately read it. Process names
# are cut to 15 characters by the kernel: git-remote-https is "git-remote-http",
# git-credential-store "git-credential-", docker-credential-* "docker-credenti".
- list: coding_agent_ssh_clients
  items: [ssh, scp, sftp, ssh-add, ssh-keygen, git, git-remote-http]
- list: coding_agent_git_credential_tools
  items: [git, git-credential-, git-remote-http, gh]
- list: coding_agent_gpg_tools
  items: [gpg, gpg2, gpg-agent, gpgsm, gpgconf, keyboxd, scdaemon]
- list: coding_agent_docker_tools
  items: [docker, docker-credenti, docker-compose, docker-buildx, podman]
- list: coding_agent_kube_tools
  items: [kubectl, helm, k9s, kubelogin, kubectx, kubens, kustomize, minikube, kind]
- list: coding_agent_postgres_tools
  items: [psql, pg_dump, pg_dumpall, pg_restore]

# The CLI itself. Its process name alone isn't enough: Claude Code does part of
# its file I/O on worker threads that Falco reports as "Bun Pool N", so the
# executable path is checked as well.
- macro: coding_agent_proc
  condition: >
    (proc.name in (coding_agent_binaries)
     or proc.exepath endswith "/claude" or proc.exepath endswith "/codex")

# Any ancestor up to 8 levels is a coding agent CLI.
- macro: coding_agent_descendant
  condition: >
    (proc.aname[1] in (coding_agent_binaries) or proc.aname[2] in (coding_agent_binaries)
     or proc.aname[3] in (coding_agent_binaries) or proc.aname[4] in (coding_agent_binaries)
     or proc.aname[5] in (coding_agent_binaries) or proc.aname[6] in (coding_agent_binaries)
     or proc.aname[7] in (coding_agent_binaries) or proc.aname[8] in (coding_agent_binaries))

# Started by HIB for an agent session, or a descendant of such a process:
# HIB_SESSION=<session id> is inherited through fork and exec.
- macro: hib_session_proc
  condition: proc.env contains "HIB_SESSION="

# In a HIB session scope (HIB 0.4.0+, [events] session_scope = true): the
# scope's cgroup, .../app.slice/hib-w_<16 hex>-<8 hex>.scope. Falco lists it in
# thread.cgroups under the controllers enabled down to the scope (on cgroup v2
# often only memory), so the whole string is matched.
- macro: hib_session_scope
  condition: thread.cgroups contains "/hib-w_"

- macro: hib_session
  condition: (hib_session_scope or hib_session_proc)

# The agent CLI HIB started (its parent is HIB's daemon, which runs on bun;
# systemd-run execs into the scope, so that stays true with scopes), as
# opposed to what that CLI started. Covers a CLI under any process name.
- macro: hib_session_cli
  condition: (hib_session and (proc.pname = bun or proc.pexepath endswith "/bun"))

- macro: coding_agent_activity
  condition: (coding_agent_proc or coding_agent_descendant or hib_session)

# Something an agent started, never the CLI itself.
- macro: coding_agent_child
  condition: >
    ((coding_agent_descendant and not coding_agent_proc)
     or (hib_session and not coding_agent_proc and not hib_session_cli))

# A file put into place by rename (mv, sed -i, editors' atomic saves): the new
# name is fs.path.target. A hard or symbolic link: the new name is
# fs.path.source (fs.path.target is what it points to).
- macro: coding_agent_rename
  condition: evt.type in (rename, renameat, renameat2) and evt.res = SUCCESS

- macro: coding_agent_link
  condition: evt.type in (link, linkat, symlink, symlinkat) and evt.res = SUCCESS

- macro: user_credential_store
  condition: >
    (fd.name contains "/.ssh/" or fd.name contains "/.aws/" or fd.name contains "/.gnupg/"
     or fd.name contains "/.config/gh/" or fd.name contains "/.kube/"
     or fd.name endswith "/.netrc" or fd.name endswith "/.git-credentials"
     or fd.name endswith "/.docker/config.json" or fd.name endswith "/.pgpass")

# The store is read by its own tool (an agent running gh, git push, docker,
# kubectl, a signed commit): ordinary work, not an alert.
- macro: credential_store_read_by_own_tool
  condition: >
    ((proc.name in (coding_agent_ssh_clients) and fd.name contains "/.ssh/")
     or (proc.name = gh and fd.name contains "/.config/gh/")
     or (proc.name in (coding_agent_git_credential_tools)
         and (fd.name endswith "/.git-credentials" or fd.name endswith "/.netrc"))
     or (proc.name in (coding_agent_gpg_tools) and fd.name contains "/.gnupg/")
     or (proc.name in (coding_agent_docker_tools) and fd.name endswith "/.docker/config.json")
     or (proc.name in (coding_agent_kube_tools) and fd.name contains "/.kube/")
     or (proc.name = aws and fd.name contains "/.aws/")
     or (proc.name in (coding_agent_postgres_tools) and fd.name endswith "/.pgpass"))

- macro: agent_credential_file
  condition: >
    (fd.name endswith "/.claude/.credentials.json" or fd.name endswith "/.codex/auth.json"
     or fd.name endswith "/.hib/token" or fd.name endswith "/.hib/vault.key")

# The path macros below exist three times: on fd.name for writes through
# open(), on fs.path.target for renames, on fs.path.source for links. Keep them
# in step (scripts/test-coding-agent-rules.sh has a case for each).
- macro: shell_or_login_persistence_file
  condition: >
    (fd.name endswith "/.bashrc" or fd.name endswith "/.bash_profile" or fd.name endswith "/.bash_login"
     or fd.name endswith "/.bash_logout" or fd.name endswith "/.profile"
     or fd.name endswith "/.zshrc" or fd.name endswith "/.zshenv" or fd.name endswith "/.zprofile"
     or fd.name endswith "/.zlogin" or fd.name endswith "/.zlogout"
     or fd.name endswith "/.config/fish/config.fish" or fd.name contains "/.config/fish/conf.d/"
     or fd.name endswith "/.pam_environment" or fd.name contains "/.config/environment.d/"
     or fd.name = /etc/profile or fd.name startswith /etc/profile.d/ or fd.name = /etc/environment
     or fd.name = /etc/bash.bashrc or fd.name startswith /etc/zsh/
     or fd.name endswith "/.ssh/authorized_keys" or fd.name endswith "/.ssh/rc"
     or fd.name startswith "/etc/cron" or fd.name startswith "/var/spool/cron"
     or fd.name startswith /etc/systemd/system/
     or fd.name contains "/.config/systemd/user/" or fd.name contains "/.config/autostart/")

- macro: shell_or_login_persistence_target
  condition: >
    (fs.path.target endswith "/.bashrc" or fs.path.target endswith "/.bash_profile" or fs.path.target endswith "/.bash_login"
     or fs.path.target endswith "/.bash_logout" or fs.path.target endswith "/.profile"
     or fs.path.target endswith "/.zshrc" or fs.path.target endswith "/.zshenv" or fs.path.target endswith "/.zprofile"
     or fs.path.target endswith "/.zlogin" or fs.path.target endswith "/.zlogout"
     or fs.path.target endswith "/.config/fish/config.fish" or fs.path.target contains "/.config/fish/conf.d/"
     or fs.path.target endswith "/.pam_environment" or fs.path.target contains "/.config/environment.d/"
     or fs.path.target = /etc/profile or fs.path.target startswith /etc/profile.d/ or fs.path.target = /etc/environment
     or fs.path.target = /etc/bash.bashrc or fs.path.target startswith /etc/zsh/
     or fs.path.target endswith "/.ssh/authorized_keys" or fs.path.target endswith "/.ssh/rc"
     or fs.path.target startswith "/etc/cron" or fs.path.target startswith "/var/spool/cron"
     or fs.path.target startswith /etc/systemd/system/
     or fs.path.target contains "/.config/systemd/user/" or fs.path.target contains "/.config/autostart/")

- macro: shell_or_login_persistence_source
  condition: >
    (fs.path.source endswith "/.bashrc" or fs.path.source endswith "/.bash_profile" or fs.path.source endswith "/.bash_login"
     or fs.path.source endswith "/.bash_logout" or fs.path.source endswith "/.profile"
     or fs.path.source endswith "/.zshrc" or fs.path.source endswith "/.zshenv" or fs.path.source endswith "/.zprofile"
     or fs.path.source endswith "/.zlogin" or fs.path.source endswith "/.zlogout"
     or fs.path.source endswith "/.config/fish/config.fish" or fs.path.source contains "/.config/fish/conf.d/"
     or fs.path.source endswith "/.pam_environment" or fs.path.source contains "/.config/environment.d/"
     or fs.path.source = /etc/profile or fs.path.source startswith /etc/profile.d/ or fs.path.source = /etc/environment
     or fs.path.source = /etc/bash.bashrc or fs.path.source startswith /etc/zsh/
     or fs.path.source endswith "/.ssh/authorized_keys" or fs.path.source endswith "/.ssh/rc"
     or fs.path.source startswith "/etc/cron" or fs.path.source startswith "/var/spool/cron"
     or fs.path.source startswith /etc/systemd/system/
     or fs.path.source contains "/.config/systemd/user/" or fs.path.source contains "/.config/autostart/")

# git init/clone copies inert *.sample hooks from its templates; those don't run.
- macro: git_hook_file
  condition: (fd.name contains "/.git/hooks/" and not fd.name endswith ".sample")

- macro: git_hook_target
  condition: (fs.path.target contains "/.git/hooks/" and not fs.path.target endswith ".sample")

- macro: git_hook_source
  condition: (fs.path.source contains "/.git/hooks/" and not fs.path.source endswith ".sample")

- macro: agent_config_file
  condition: >
    (fd.name endswith "/.mcp.json" or fd.name contains "/.claude/settings"
     or fd.name endswith "/.codex/config.toml")

- macro: agent_config_target
  condition: >
    (fs.path.target endswith "/.mcp.json" or fs.path.target contains "/.claude/settings"
     or fs.path.target endswith "/.codex/config.toml")

- macro: agent_config_source
  condition: >
    (fs.path.source endswith "/.mcp.json" or fs.path.source contains "/.claude/settings"
     or fs.path.source endswith "/.codex/config.toml")

# Conditions test the event type and path first and agent ancestry last: the
# ancestry check walks up to 8 parents, so it should only run for the few
# events that already match a path.

- rule: Coding Agent Read Credential Store
  desc: >
    A coding agent or a process it started read a user credential store (SSH
    keys, cloud, GitHub, kube or registry credentials) with something other
    than that store's own tool (e.g. cat, a script, the agent CLI). HIB denies
    these paths to agents; a hit means an unsandboxed agent or a bypass.
  condition: >
    open_read and user_credential_store and coding_agent_activity
    and not credential_store_read_by_own_tool
  output: >
    Coding agent read a credential store (file=%fd.name process=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname ancestors=%proc.aname[2]>%proc.aname[3]
    exe=%proc.exepath user=%user.name session=%proc.env[HIB_SESSION] cgroups=%thread.cgroups container=%container.name)
  priority: WARNING
  tags: [coding_agent, hib, mitre_credential_access, T1552.001]

- rule: Coding Agent Subprocess Read Agent Credentials
  desc: >
    A process started by a coding agent (not the agent CLI itself) read the
    agent's or HIB's own credentials. The CLIs read these legitimately; their
    children never need to.
  condition: >
    open_read and agent_credential_file and coding_agent_child
  output: >
    Coding agent subprocess read agent credentials (file=%fd.name process=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname user=%user.name session=%proc.env[HIB_SESSION] cgroups=%thread.cgroups container=%container.name)
  priority: CRITICAL
  tags: [coding_agent, hib, mitre_credential_access, T1552.001]

- rule: Coding Agent Write Shell or Login Persistence
  desc: >
    A coding agent or a process it started wrote a shell startup file,
    authorized_keys, a crontab or a systemd/autostart unit, or renamed or
    linked a file into one of those places.
  condition: >
    ((open_write and shell_or_login_persistence_file)
     or (coding_agent_rename and shell_or_login_persistence_target)
     or (coding_agent_link and shell_or_login_persistence_source))
    and coding_agent_activity
  output: >
    Coding agent wrote a persistence file (file=%fd.name new=%fs.path.source>%fs.path.target
    syscall=%evt.type process=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    user=%user.name session=%proc.env[HIB_SESSION] cgroups=%thread.cgroups container=%container.name)
  priority: CRITICAL
  tags: [coding_agent, hib, mitre_persistence, T1546.004]

- rule: Coding Agent Write Repository or Agent Hook
  desc: >
    A coding agent (the CLI itself included) or a process it started wrote a
    git hook, or a process it started wrote .mcp.json or agent settings
    (the CLIs write their own settings legitimately). Renames and links into
    place count too. HIB reverts unapproved changes (protected.reverted); this
    shows the attempt itself, including outside HIB. git's inert *.sample
    hooks are ignored; a real hook written by git (e.g. from a --template
    dir) is not.
  condition: >
    (((open_write and git_hook_file)
      or (coding_agent_rename and git_hook_target)
      or (coding_agent_link and git_hook_source))
     and coding_agent_activity)
    or (((open_write and agent_config_file)
         or (coding_agent_rename and agent_config_target)
         or (coding_agent_link and agent_config_source))
        and coding_agent_child)
  output: >
    Coding agent wrote a hook or agent config (file=%fd.name new=%fs.path.source>%fs.path.target
    syscall=%evt.type process=%proc.name cmdline=%proc.cmdline parent=%proc.pname
    user=%user.name session=%proc.env[HIB_SESSION] cgroups=%thread.cgroups container=%container.name)
  priority: WARNING
  tags: [coding_agent, hib, mitre_persistence, T1546]

- rule: HIB Secrets Read by Unexpected Process
  desc: >
    Something other than the HIB daemon (bun, including its worker threads)
    read HIB's API token or vault key. The token unlocks the whole daemon,
    including its terminal.
  condition: >
    open_read and (fd.name endswith "/.hib/token" or fd.name endswith "/.hib/vault.key")
    and not (proc.name = bun or proc.exepath endswith "/bun")
  output: >
    HIB secret read by unexpected process (file=%fd.name process=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname exe=%proc.exepath user=%user.name
    session=%proc.env[HIB_SESSION] cgroups=%thread.cgroups container=%container.name)
  priority: WARNING
  tags: [coding_agent, hib, mitre_credential_access, T1552.001]
