# Alerting Stack - Falcosidekick

services:
  sidekick:
    image: falcosecurity/falcosidekick:2.29.0
    container_name: sib-sidekick
    init: true
    restart: unless-stopped
    group_add:
      - "${SIDECAR_CONFIG_GID:-1000}"
    ports:
      - "${SIDEKICK_BIND_ADDR:-127.0.0.1}:${SIDEKICK_PORT:-2801}:2801"
    volumes:
      - ./config/config.yaml:/etc/falcosidekick/config.yaml:ro
      # mTLS certificates (mounted when MTLS_ENABLED=true)
      - ../certs:/certs:ro
    command: ["-c", "/etc/falcosidekick/config.yaml"]
    environment:
      - DEBUG=${SIDEKICK_DEBUG:-false}
      - MINIMUMPRIORITY=${SIDEKICK_MINIMUM_PRIORITY:-notice}
      # mTLS configuration (optional - disabled by default)
      - WEBSERVER_SSL=${MTLS_ENABLED:-false}
      - WEBSERVER_CERTFILE=/certs/server/server.crt
      - WEBSERVER_KEYFILE=/certs/server/server.key
      - WEBSERVER_MUTUALTLS=${MTLS_ENABLED:-false}
      - WEBSERVER_CACERTFILE=/certs/ca/ca.crt
      # Alert outputs (Slack, PagerDuty, ...) are rendered into config.yaml by
      # scripts/generate-sidekick-config.sh. They are deliberately NOT passed as
      # env vars: Falcosidekick lets env override the config file, so a
      # set-but-empty var here would silently disable a configured output.
    networks:
      - sib-network
    healthcheck:
      # Inspect the listening socket without opening a TLS connection. `nc -z`
      # produced a certificate-less handshake error every 30 seconds in mTLS mode.
      test: ["CMD-SHELL", "for f in /proc/net/tcp /proc/net/tcp6; do while read -r _ local _ state _; do [ \"$${state}\" = 0A ] && case \"$${local}\" in *:0AF1) exit 0;; esac; done < \"$${f}\"; done; exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  sib-network:
    external: true
