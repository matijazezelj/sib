services:
  ansible:
    build:
      context: .
      dockerfile: Dockerfile
    image: sib-ansible:${SIB_ANSIBLE_VERSION:-local}
    volumes:
      # Mount ansible directory
      - .:/ansible:ro
      # Mount detection config for pushing to fleet (falco.yaml + rules)
      - ../detection/config:/detection-config:ro
      # Mount certificates for mTLS distribution
      - ../certs:/certs:ro
      # Mount SSH keys from host (ansible user is uid 1000)
      - ~/.ssh:/home/ansible/.ssh:ro
      # Mount SSH agent socket (for macOS/Linux)
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - ANSIBLE_HOST_KEY_CHECKING=false
      - ANSIBLE_FORCE_COLOR=true
    working_dir: /ansible
    network_mode: host
