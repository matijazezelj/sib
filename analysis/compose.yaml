services:
  sib-analysis:
    build: .
    container_name: sib-analysis
    restart: unless-stopped
    ports:
      - "${ANALYSIS_BIND:-127.0.0.1}:${ANALYSIS_PORT:-5000}:5000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - analysis-cache:/app/cache
    networks:
      - sib-network
    environment:
      - PYTHONUNBUFFERED=1
      - STACK=${STACK:-vm}
      # Shared secret required by every endpoint except /health
      - ANALYSIS_API_TOKEN=${ANALYSIS_API_TOKEN:-}
      # Comma-separated origins allowed to call the API cross-origin (default: none)
      - ANALYSIS_CORS_ORIGINS=${ANALYSIS_CORS_ORIGINS:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  analysis-cache:

networks:
  sib-network:
    external: true
